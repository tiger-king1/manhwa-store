<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شات الأدمن والفضفضة 💬🗿</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161926;
      --text-color: #fff;
      --text-muted: #b0c4de;
      --border-color: #333;
      --accent: #8a2be2;
      --accent-glow: #00f2fe;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card-bg);
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .logo { color: var(--accent-glow); font-size: 16px; font-weight: bold; }
    .chat-container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 15px;
      overflow: hidden;
    }
    .messages-box {
      flex: 1;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }
    .message {
      background: rgba(138, 43, 226, 0.15);
      border: 1px solid var(--accent);
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
      word-break: break-word;
    }
    .message.mine {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent-glow);
      align-self: flex-end;
    }
    .msg-user { font-size: 11px; color: var(--accent-glow); font-weight: bold; margin-bottom: 4px; display: block; }
    .msg-text { font-size: 13px; color: #fff; line-height: 1.4; }
    .chat-input-area {
      display: flex;
      gap: 10px;
    }
    .chat-input {
      flex: 1;
      background: var(--card-bg);
      border: 2px solid var(--accent);
      color: var(--text-color);
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      font-weight: bold;
    }
    .send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-glow));
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }
    .send-btn:hover { opacity: 0.9; transform: scale(1.02); }
  </style>
</head>
<body>

  <header>
    <div class="logo">💬 شات الأدمن السري</div>
    <a href="index.html" style="color:var(--text-muted); text-decoration:none; font-size:12px; font-weight:bold;">← عودة للموقع</a>
  </header>

  <div class="chat-container">
    <div class="messages-box" id="messagesBox">
      <!-- الرسائل تظهر هنا -->
    </div>
    
    <div class="chat-input-area">
      <input type="text" id="messageInput" class="chat-input" placeholder="اكتب رسالتك هنا يا أسطورة..." onkeypress="checkEnter(event)">
      <button class="send-btn" onclick="sendMessage()">إرسال 🚀</button>
    </div>
  </div>

  <script>
    const userProfile = JSON.parse(localStorage.getItem('userProfile') || '{"name": "أدمن مجهول", "username": "admin"}');
    
    function loadMessages() {
      const messagesBox = document.getElementById('messagesBox');
      const messages = JSON.parse(localStorage.getItem('adminChatMessages') || '[{"user": "النظام", "text": "مرحباً بكم في شات الأدمن الخاص بموقع المانهوا! 🗿🔥"}]');
      
      let html = '';
      messages.forEach(msg => {
        const isMine = msg.user === (userProfile.name || userProfile.username);
        html += `
          <div class="message ${isMine ? 'mine' : ''}">
            <span class="msg-user">${msg.user}</span>
            <div class="msg-text">${msg.text}</div>
          </div>
        `;
      });
      messagesBox.innerHTML = html;
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const messages = JSON.parse(localStorage.getItem('adminChatMessages') || '[]');
      const senderName = userProfile.name || userProfile.username || 'أدمن';
      
      messages.push({ user: senderName, text: text });
      localStorage.setItem('adminChatMessages', JSON.stringify(messages));
      
      input.value = '';
      loadMessages();
    }

    function checkEnter(e) {
      if (e.key === 'Enter') sendMessage();
    }

    window.onload = function() {
      loadMessages();
      setInterval(loadMessages, 2000); // تحديث تلقائي للرسائل
    };
  </script>
</body>
</html>
