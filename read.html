<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قراءة الفصل - مانهوانا Manhwana 🗿🔥</title>
  <style>
    :root {
      --bg-color: #05070b;
      --card-bg: #161926;
      --text-color: #fff;
      --text-muted: #8c96a5;
      --border-color: #24283b;
      --header-bg: rgba(22, 25, 38, 0.95);
      --accent: #e50914;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      width: 100%;
      overflow-x: hidden;
    }
    
    header {
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .chapter-title-header { font-size: 15px; font-weight: bold; color: #fff; }

    /* حاوية صفحات المانهوا */
    .reader-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .reader-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
      border: none;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 100px 20px;
    }

    /* زر الأدمن لإضافة صور الفصل */
    .admin-add-chapter-btn {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #e50914;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(229, 9, 20, 0.5);
      z-index: 2000;
      display: none;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 15px;
    }
    .modal-content {
      background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #e50914; width: 100%; max-width: 400px;
    }
    .modal-content textarea {
      width: 100%; height: 120px; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-color); padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; outline: none;
    }
    .btn { background: #e50914; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; width: 100%; text-align: center; }
  </style>
</head>
<body data-theme="dark">

  <header>
    <button class="back-btn" onclick="history.back()">←</button>
    <div class="chapter-title-header" id="headerTitle">قراءة الفصل</div>
    <div style="width: 24px;"></div>
  </header>

  <!-- زر الأدمن لإضافة صور الفصل (يظهر للأدمن فقط) -->
  <button id="adminAddBtn" class="admin-add-chapter-btn" onclick="openModal()">➕ إضافة صور الفصل</button>

  <!-- نافذة إضافة الصور للأدمن -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
      <h3 style="color: #fff; margin-top:0; font-size:16px;">إضافة صفحات الفصل 🖼️</h3>
      <p style="font-size: 11px; color: var(--text-muted);">ضع كل رابط صورة في سطر جديد:</p>
      <textarea id="imageLinksInput" placeholder="https://.../img1.jpg&#10;https://.../img2.jpg"></textarea>
      <button onclick="saveChapterImages()" class="btn" style="margin-bottom:8px;">نشر الصور بالسحابة</button>
      <button onclick="closeModal()" class="btn" style="background:#444;">إلغاء</button>
    </div>
  </div>

  <!-- عرض صور صفحات المانهوا -->
  <div class="reader-container" id="readerContainer">
    <div class="empty-msg">جاري تحميل صفحات الفصل... ⏳</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZmtucnCz49Z0nqX4luO5Ct7yvyHkLQVg",
      authDomain: "manhwastore.firebaseapp.com",
      projectId: "manhwastore",
      storageBucket: "manhwastore.firebasestorage.app",
      messagingSenderId: "706758090521",
      appId: "1:706758090521:web:f2cf72a74a9e36e5296f88",
      measurementId: "G-MS0H0PW03Q"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const workTitle = urlParams.get('title') || 'العمل';
    const chapterNum = urlParams.get('chapter') || '1';

    document.getElementById("headerTitle").innerText = `${workTitle} - الفصل ${chapterNum}`;

    const adminUsernames = ["admin", "yhya", "andrew"];
    const currentUser = (localStorage.getItem("currentUser") || "").toLowerCase().trim();
    const isAdmin = adminUsernames.includes(currentUser);

    if (isAdmin) {
      document.getElementById("adminAddBtn").style.display = "block";
    }

    window.openModal = function() { document.getElementById("modalOverlay").style.display = "flex"; };
    window.closeModal = function() { document.getElementById("modalOverlay").style.display = "none"; };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    // معرف فريد لكل فصل بناءً على اسم العمل ورقم الفصل
    const docId = `${workTitle.replace(/\s+/g, '_')}_ch_${chapterNum}`;
    const chapterRef = doc(db, "chapters", docId);

    async function loadChapterImages() {
      const container = document.getElementById("readerContainer");
      try {
        const snap = await getDoc(chapterRef);
        if (snap.exists() && snap.data().images && snap.data().images.length > 0) {
          const imgs = snap.data().images;
          container.innerHTML = "";
          imgs.forEach(url => {
            const img = document.createElement("img");
            img.src = url;
            img.alt = "صفحة المانهوا";
            container.appendChild(img);
          });
        } else {
          container.innerHTML = `<div class='empty-msg'>لا توجد صور مضافة لهذا الفصل حتى الآن. ${isAdmin ? '<br><b style="color:#e50914;">(اضغط الزر بالأسفل لإضافة الصور)</b>' : ''}</div>`;
        }
      } catch(e) {
        container.innerHTML = "<div class='empty-msg'>حدث خطأ في تحميل الصور.</div>";
      }
    }

    loadChapterImages();

    window.saveChapterImages = async function() {
      if (!isAdmin) return;
      const text = document.getElementById("imageLinksInput").value.trim();
      if (!text) {
        alert("يرجى إدخال روابط الصور!");
        return;
      }

      const images = text.split("\n").map(link => link.trim()).filter(link => link.length > 0);

      try {
        await setDoc(chapterRef, { workTitle, chapterNum, images }, { merge: true });
        alert("تم رفع صور الفصل بنجاح!");
        closeModal();
        loadChapterImages();
      } catch(e) {
        alert("حدث خطأ أثناء الحفظ!");
      }
    };
  </script>
</body>
</html>
