<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الرئيسية - مانهوانا Manhwana 🗿🔥</title>

  <!-- كود إعلان Adsterra -->
  <script data-cfasync="false" src="https://bauval.org/14/69ee4c1eb8a2cce7a3d94c18ec7fa810"></script>

  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161926;
      --text-color: #fff;
      --text-muted: #8c96a5;
      --border-color: #24283b;
      --header-bg: #161926;
      --accent: #e50914;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0 0 90px 0;
      font-family: sans-serif;
      width: 100%;
      overflow-x: hidden;
    }
    
    header {
      background: var(--header-bg);
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .logo-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo-icon { background: #e50914; color: #fff; font-weight: bold; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .logo-text { color: #fff; font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }

    .hero-slider {
      width: 100%; max-width: 960px; margin: 15px auto; height: 200px; border-radius: 12px;
      overflow: hidden; position: relative; background: var(--card-bg); border: 1px solid var(--border-color);
    }
    .hero-slide { position: absolute; top: 0; right: 0; width: 100%; height: 100%; display: flex; opacity: 0; transition: opacity 0.8s ease-in-out; }
    .hero-slide.active { opacity: 1; }
    .hero-img { width: 45%; height: 100%; object-fit: cover; flex-shrink: 0; }
    .hero-content { width: 55%; padding: 15px; display: flex; flex-direction: column; justify-content: center; background: linear-gradient(to left, var(--card-bg), transparent); }
    .hero-title { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .container { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 12px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px 0; }
    .section-title { color: #fff; font-size: 16px; font-weight: bold; border-right: 4px solid #e50914; padding-right: 8px; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    @media(min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; } }

    .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); transition: 0.2s; position: relative; cursor: pointer; user-select: none; }
    .card:hover { transform: translateY(-3px); border-color: #e50914; }
    .card img { width: 100%; height: 170px; object-fit: cover; display: block; }
    .card-body { padding: 8px; }
    .card-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-info { font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; }
    .imdb-badge { background: #f5c518; color: #000; padding: 1px 4px; border-radius: 3px; font-weight: bold; font-size: 9px; }

    /* شريط التنقل السفلي */
    .bottom-nav {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 480px; background: rgba(22, 25, 38, 0.95);
      backdrop-filter: blur(12px); border: 1px solid var(--border-color);
      display: flex; justify-content: space-around; padding: 8px 5px; z-index: 1000;
      border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .nav-item {
      background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-decoration: none; transition: 0.2s;
      padding: 6px 14px; border-radius: 12px;
    }
    .nav-item.active, .nav-item:hover { color: #fff; background: rgba(229, 9, 20, 0.2); }
    .nav-item.active svg { fill: #e50914; stroke: #e50914; transform: scale(1.15); }
    .nav-item svg { width: 20px; height: 20px; fill: var(--text-muted); stroke: var(--text-muted); transition: 0.2s; }

    .admin-floating-btn {
      position: fixed; bottom: 85px; right: 15px; width: 45px; height: 45px; border-radius: 50%;
      background: #e50914; color: #fff; display: none;
      align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); z-index: 999;
    }

    .admin-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
    .admin-modal-content { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid #e50914; width: 100%; max-width: 380px; }
    .admin-modal-content input, .admin-modal-content select, .admin-modal-content textarea {
      width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color);
      padding: 9px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; outline: none;
    }
    .btn { background: #e50914; color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; width: 100%; text-align: center; }
  </style>
</head>
<body data-theme="dark">

  <header>
    <div class="logo-container" onclick="location.href='index.html'">
      <div class="logo-icon">M</div>
      <div class="logo-text">مانهوانا</div>
    </div>
  </header>

  <div id="adminFloatingBtn" class="admin-floating-btn" onclick="openAdminModal('add')" title="إضافة مانهوا">➕</div>

  <!-- نافذة إضافة / تعديل العمل (للأدمن) -->
  <div id="adminModalOverlay" class="admin-modal-overlay">
    <div class="admin-modal-content">
      <h3 id="modalTitleText" style="color: #fff; margin-top:0; font-size:15px;">إضافة عمل جديد ☁️</h3>
      <input type="hidden" id="editWorkId">
      <input type="text" id="newTitle" placeholder="اسم المانهوا / المانجا">
      <input type="text" id="newCover" placeholder="رابط صورة الغلاف">
      <textarea id="newDesc" placeholder="القصة..." style="height: 50px;"></textarea>
      <select id="newGenreSelect">
        <option value="أكشن">أكشن</option>
        <option value="فانتزيا">فانتزيا</option>
        <option value="مغامرات">مغامرات</option>
        <option value="دراما">دراما</option>
      </select>
      <button onclick="saveWorkData()" class="btn" style="margin-bottom:6px;">حفظ ونشر</button>
      <button onclick="closeAdminModal()" class="btn" style="background:#444;">إلغاء</button>
    </div>
  </div>

  <div>
    <div class="hero-slider" id="heroSlider"></div>

    <div class="container">
      <div class="section-header">
        <div class="section-title">أحدث الإضافات</div>
      </div>
      <div class="grid" id="manhwaGrid"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="search.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>بحث</span>
    </a>
    <a href="genres.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      <span>الأقسام</span>
    </a>
    <a href="account.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>الحساب</span>
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZmtucnCz49Z0nqX4luO5Ct7yvyHkLQVg",
      authDomain: "manhwastore.firebaseapp.com",
      projectId: "manhwastore",
      storageBucket: "manhwastore.firebasestorage.app",
      messagingSenderId: "706758090521",
      appId: "1:706758090521:web:f2cf72a74a9e36e5296f88",
      measurementId: "G-MS0H0PW03Q"
    };

    let manhwaData = [
      { title: "Solo Leveling", cover: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500", genre: "أكشن", desc: "قصة الصياد الأضعف الذي أصبح الأقوى." },
      { title: "Omniscient Reader", cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500", genre: "فانتزيا", desc: "رواية تقلب العالم رأساً على عقب." }
    ];

    const adminUsernames = ["admin", "yhya", "andrew"];

    function checkAdminAuth() {
      const user = (localStorage.getItem("currentUser") || "").toLowerCase().trim();
      return adminUsernames.includes(user);
    }

    function applyAdminUI() {
      const isAdmin = checkAdminAuth();
      document.getElementById("adminFloatingBtn").style.display = isAdmin ? "flex" : "none";
    }

    function renderGrid(list) {
      const grid = document.getElementById("manhwaGrid");
      grid.innerHTML = "";
      const isAdmin = checkAdminAuth();

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        // الضغط العادي: فتح صفحة التفاصيل
        card.onclick = () => {
          location.href = `details.html?title=${encodeURIComponent(item.title)}&cover=${encodeURIComponent(item.cover)}&desc=${encodeURIComponent(item.desc || '')}&genre=${encodeURIComponent(item.genre || '')}`;
        };

        // الضغط المطول (Long Press لمدّة نصف ثانية) للأدمن فقط للتعديل
        let pressTimer;
        card.onmousedown = card.ontouchstart = (e) => {
          if (!isAdmin) return;
          pressTimer = setTimeout(() => {
            openAdminModal('edit', item);
          }, 500); // 500 ميللي ثانية (نصف ثانية)
        };

        card.onmouseup = card.ontouchend = card.onmouseleave = () => {
          clearTimeout(pressTimer);
        };

        const deleteBtn = isAdmin && item.id ? `<button style="position:absolute; top:6px; right:6px; background:rgba(229,9,20,0.9); border:none; color:#fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; z-index:5;" onclick="event.stopPropagation(); deleteItem('${item.id}')">🗑️</button>` : '';

        card.innerHTML = `
          ${deleteBtn}
          <img src="${item.cover || 'https://via.placeholder.com/150'}" alt="${item.title}">
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-info">
              <span>${item.genre || 'مانهوا'}</span>
              <span class="imdb-badge">8.5</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderHero(list) {
      const slider = document.getElementById("heroSlider");
      if (!list || list.length === 0) {
        slider.style.display = "none";
        return;
      }
      slider.style.display = "block";
      const item = list[0];
      slider.innerHTML = `
        <div class="hero-slide active">
          <img class="hero-img" src="${item.cover}" alt="${item.title}">
          <div class="hero-content">
            <div class="hero-title">${item.title}</div>
            <div class="hero-desc">${item.desc || 'قصة مشوقة ومميزة.'}</div>
            <button class="btn" style="width:90px; padding:5px; font-size:11px;" onclick="location.href='details.html?title=${encodeURIComponent(item.title)}&cover=${encodeURIComponent(item.cover)}&desc=${encodeURIComponent(item.desc || '')}&genre=${encodeURIComponent(item.genre || '')}'">قراءة الآن</button>
          </div>
        </div>
      `;
    }

    renderGrid(manhwaData);
    renderHero(manhwaData);
    applyAdminUI();

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      const manhwaCollection = collection(db, "manhwas");

      onSnapshot(manhwaCollection, (snapshot) => {
        const firebaseData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (firebaseData.length > 0) {
          manhwaData = firebaseData;
          renderGrid(manhwaData);
          renderHero(manhwaData);
        }
      });
    } catch(e) {}

    window.openAdminModal = function(mode, item = null) {
      if (!checkAdminAuth()) return;
      document.getElementById("adminModalOverlay").style.display = "flex";
      if (mode === 'edit' && item) {
        document.getElementById("modalTitleText").innerText = "تعديل العمل ✍️";
        document.getElementById("editWorkId").value = item.id || "";
        document.getElementById("newTitle").value = item.title || "";
        document.getElementById("newCover").value = item.cover || "";
        document.getElementById("newDesc").value = item.desc || "";
        document.getElementById("newGenreSelect").value = item.genre || "أكشن";
      } else {
        document.getElementById("modalTitleText").innerText = "إضافة عمل جديد ☁️";
        document.getElementById("editWorkId").value = "";
        document.getElementById("newTitle").value = "";
        document.getElementById("newCover").value = "";
        document.getElementById("newDesc").value = "";
      }
    };

    window.closeAdminModal = function() {
      document.getElementById("adminModalOverlay").style.display = "none";
    };

    window.saveWorkData = async function() {
      if (!checkAdminAuth()) return;
      const id = document.getElementById("editWorkId").value;
      const title = document.getElementById("newTitle").value.trim();
      const cover = document.getElementById("newCover").value.trim();
      const desc = document.getElementById("newDesc").value.trim();
      const genre = document.getElementById("newGenreSelect").value;

      if (!title || !cover) {
        alert("يرجى إدخال العنوان ورابط الغلاف!");
        return;
      }

      if (db) {
        const { collection, addDoc, updateDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
        if (id) {
          await updateDoc(doc(db, "manhwas", id), { title, cover, desc, genre });
          alert("تم تعديل العمل بنجاح!");
        } else {
          await addDoc(collection(db, "manhwas", { title, cover, desc, genre, createdAt: new Date() }));
          alert("تمت الإضافة بنجاح!");
        }
      }
      closeAdminModal();
    };

    window.deleteItem = async function(id) {
      if (!checkAdminAuth()) return;
      if (confirm("هل تريد حذف هذا العمل نهائياً؟") && db) {
        const { deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
        await deleteDoc(doc(db, "manhwas", id));
      }
    };
  </script>
</body>
</html>
