<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع المانهوا الاحترافي</title>
  <style>
    body {
      background-color: #0d0f17;
      color: #fff;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    
    header {
      background: #161926;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #8a2be2;
      position: relative;
    }
    
    .logo {
      color: #00f2fe;
      font-size: 20px;
      font-weight: bold;
    }

    /* زر تسجيل الدخول للزوار */
    .login-nav-btn {
      background: #8a2be2;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      transition: 0.2s;
    }
    .login-nav-btn:hover {
      background: #00f2fe;
      color: #000;
    }

    /* صورة الملف الشخصي (Avatar) في الهيدر */
    .user-avatar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #8a2be2;
      cursor: pointer;
      object-fit: cover;
      display: none; /* تظهر بالـ JS بعد تسجيل الدخول */
      transition: 0.2s;
    }
    .user-avatar-btn:hover {
      border-color: #00f2fe;
      transform: scale(1.05);
    }

    /* نافذة البروفايل المنسدلة */
    .profile-modal {
      position: absolute;
      top: 60px;
      left: 15px;
      background: #161926;
      border: 1px solid #8a2be2;
      border-radius: 12px;
      padding: 15px;
      width: 250px;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      z-index: 1000;
    }
    .profile-modal h4 {
      margin: 0 0 10px 0;
      color: #00f2fe;
      font-size: 15px;
      text-align: center;
    }
    .profile-modal input, .profile-modal textarea {
      width: 100%;
      background: #0d0f17;
      border: 1px solid #333;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      box-sizing: border-box;
      font-size: 12px;
      outline: none;
    }
    .profile-modal textarea {
      height: 50px;
      resize: none;
    }
    .profile-modal button {
      width: 100%;
      background: #8a2be2;
      color: #fff;
      border: none;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      margin-top: 4px;
    }

    /* الدائرة العائمة للأدمن بجانب الشاشة */
    .admin-floating-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8a2be2, #00f2fe);
      color: #fff;
      display: none; /* تظهر فقط للأدمن */
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 999;
      transition: transform 0.2s;
    }
    .admin-floating-btn:hover {
      transform: scale(1.1);
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      display: block;
      padding: 12px 15px;
      background: #161926;
      border: 1px solid #8a2be2;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .section-title {
      color: #00f2fe;
      font-size: 18px;
      margin-bottom: 15px;
      border-bottom: 2px solid #8a2be2;
      padding-bottom: 5px;
      display: inline-block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: #161926;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
      transition: 0.2s;
      position: relative;
    }
    .card:hover {
      border-color: #8a2be2;
      transform: translateY(-3px);
    }
    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 10px;
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      background: #8a2be2;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      display: block;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #00f2fe;
      color: #000;
    }

    .fav-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .fav-btn.active {
      color: #ff4d4d;
    }

    /* نافذة إضافة المانهوا المنبثقة للأدمن */
    .admin-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .admin-modal-content {
      background: #161926;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #8a2be2;
      width: 90%;
      max-width: 450px;
    }
    .admin-modal-content input {
      width: 100%;
      background: #0d0f17;
      border: 1px solid #333;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      box-sizing: border-box;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Manhwa Store 🗿🔥</div>
    
    <!-- زر تسجيل الدخول (يظهر فقط غير المسجلين) -->
    <a href="login.html" id="loginBtnNav" class="login-nav-btn">تسجيل الدخول</a>

    <!-- صورة الآفاتار (تظهر فقط عند تسجيل الدخول) -->
    <img id="userAvatarBtn" class="user-avatar-btn" src="" alt="Profile" onclick="toggleProfileModal()">

    <!-- نافذة تعديل البروفايل الشخصي -->
    <div id="profileModal" class="profile-modal">
      <h4>الملف الشخصي 👤</h4>
      <input type="text" id="profileNameInput" placeholder="الاسم الشخصي">
      <input type="text" id="profileAvatarInput" placeholder="رابط صورة الآفاتار">
      <textarea id="profileBioInput" placeholder="اكتب وصف قصير (Bio)..."></textarea>
      <button onclick="saveUserProfile()">حفظ البيانات</button>
      <button onclick="logoutUser()" style="background: #ff4d4d; margin-top: 8px;">تسجيل الخروج</button>
    </div>
  </header>

  <!-- الدائرة العائمة للأدمن بجانب الشاشة (تظهر للأدمن فقط) -->
  <div id="adminFloatingBtn" class="admin-floating-btn" onclick="openAdminModal()" title="إضافة مانهوا">⚙️</div>

  <!-- النافذة المنبثقة لإضافة مانهوا للأدمن -->
  <div id="adminModalOverlay" class="admin-modal-overlay">
    <div class="admin-modal-content">
      <h3 style="color: #00f2fe; margin-top:0;">🔒 لوحة الأدمن: إضافة مانهوا</h3>
      <input type="text" id="newTitle" placeholder="اسم المانهوا">
      <input type="text" id="newCover" placeholder="رابط صورة الغلاف (درايف أو مباشر)">
      <button onclick="addNewManhwa()" class="btn" style="margin-bottom: 8px;">إضافة المانهوا</button>
      <button onclick="closeAdminModal()" class="btn" style="background: #444;">إلغاء</button>
    </div>
  </div>

  <div class="container">
    <!-- شريط البحث الفوري الذكي -->
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن مانهوا فوراً..." oninput="filterManhwas()">

    <!-- قسم المفضلة -->
    <div id="favoritesSection" style="display:none;">
      <div class="section-title">⭐ المفضلة لديك</div>
      <div class="grid" id="favoritesGrid"></div>
    </div>

    <!-- قسم جميع المانهوات -->
    <div class="section-title">📚 جميع المانهوات المتاحة</div>
    <div class="grid" id="manhwasGrid"></div>
  </div>

  <script>
    const userProfile = JSON.parse(localStorage.getItem('userProfile') || 'null');
    // التحقق الصارم من صلاحيات الأدمن الحقيقي فقط
    const isAdmin = localStorage.getItem('isLoggedIn') === 'true' && userProfile && (userProfile.username === 'admin' || userProfile.name.includes('Admin'));

    window.onload = function() {
      setupAuthUI();
      loadManhwas();
    };

    function setupAuthUI() {
      const loginBtn = document.getElementById('loginBtnNav');
      const avatarBtn = document.getElementById('userAvatarBtn');
      const adminBtn = document.getElementById('adminFloatingBtn');

      // تفعيل زر الأدمن فقط للأدمن الصريح
      if (isAdmin) {
        adminBtn.style.display = 'flex';
      } else {
        adminBtn.style.display = 'none';
      }

      const isUserLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

      if (isUserLoggedIn && userProfile) {
        loginBtn.style.display = 'none';
        avatarBtn.style.display = 'block';

        const name = userProfile.name || 'مستخدم';
        const avatar = userProfile.avatar || 'https://via.placeholder.com/100/8a2be2/ffffff?text=User';
        const bio = userProfile.bio || '';

        avatarBtn.src = avatar;
        document.getElementById('profileNameInput').value = name;
        document.getElementById('profileAvatarInput').value = avatar;
        document.getElementById('profileBioInput').value = bio;
      } else {
        loginBtn.style.display = 'inline-block';
        avatarBtn.style.display = 'none';
      }
    }

    function toggleProfileModal() {
      const modal = document.getElementById('profileModal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
    }

    function saveUserProfile() {
      const name = document.getElementById('profileNameInput').value.trim();
      let avatar = document.getElementById('profileAvatarInput').value.trim();
      const bio = document.getElementById('profileBioInput').value.trim();

      if (!name) {
        alert('يرجى كتابة الاسم!');
        return;
      }

      if (avatar.includes('drive.google.com')) {
        avatar = convertDriveLink(avatar);
      }

      const updatedProfile = { ...userProfile, name, avatar, bio };
      localStorage.setItem('userProfile', JSON.stringify(updatedProfile));
      alert('تم حفظ بيانات الملف الشخصي بنجاح! ✨');
      location.reload();
    }

    function logoutUser() {
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('userProfile');
      window.location.reload();
    }

    function openAdminModal() {
      document.getElementById('adminModalOverlay').style.display = 'flex';
    }

    function closeAdminModal() {
      document.getElementById('adminModalOverlay').style.display = 'none';
    }

    function getStoredManhwas() {
      return JSON.parse(localStorage.getItem('myManhwas') || '[]');
    }

    function getFavorites() {
      return JSON.parse(localStorage.getItem('myFavorites') || '[]');
    }

    function loadManhwas() {
      const manhwas = getStoredManhwas();
      renderGrid(manhwas);
    }

    function filterManhwas() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const manhwas = getStoredManhwas();
      const filtered = manhwas.filter(m => m.title.toLowerCase().includes(query));
      renderGrid(filtered);
    }

    function renderGrid(list) {
      const grid = document.getElementById('manhwasGrid');
      const favGrid = document.getElementById('favoritesGrid');
      const favSection = document.getElementById('favoritesSection');
      const favorites = getFavorites();

      grid.innerHTML = '';
      favGrid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#777;">لا توجد مانهوات مطابقة للبحث.</p>';
        favSection.style.display = 'none';
        return;
      }

      let favList = list.filter(m => favorites.includes(m.id));
      if (favList.length > 0) {
        favSection.style.display = 'block';
        favList.forEach(m => favGrid.appendChild(createCard(m, true)));
      } else {
        favSection.style.display = 'none';
      }

      list.forEach(m => grid.appendChild(createCard(m, favorites.includes(m.id))));
    }

    function createCard(m, isFav) {
      const card = document.createElement('div');
      card.className = 'card';
      
      card.innerHTML = `
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(${m.id})">♥</button>
        <img src="${m.cover}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/180x240/1f2338/ffffff?text=No+Image'">
        <div class="card-body">
          <div class="card-title">${m.title}</div>
          <a href="manhwa.html?id=${m.id}&chap=1" class="btn">قراءة الفصل الأول</a>
        </div>
      `;
      return card;
    }

    function toggleFavorite(id) {
      let favorites = getFavorites();
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('myFavorites', JSON.stringify(favorites));
      loadManhwas();
    }

    function convertDriveLink(url) {
      url = url.trim();
      let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url;
    }

    function addNewManhwa() {
      const title = document.getElementById('newTitle').value.trim();
      let cover = document.getElementById('newCover').value.trim();

      if (!title || !cover) {
        alert('الرجاء تعبئة جميع الحقول!');
        return;
      }

      cover = convertDriveLink(cover);
      const manhwas = getStoredManhwas();
      const newId = manhwas.length > 0 ? manhwas[manhwas.length - 1].id + 1 : 1;

      manhwas.push({ id: newId, title: title, cover: cover });
      localStorage.setItem('myManhwas', JSON.stringify(manhwas));

      document.getElementById('newTitle').value = '';
      document.getElementById('newCover').value = '';
      closeAdminModal();
      alert('تمت إضافة المانهوا بنجاح!');
      loadManhwas();
    }
  </script>
</body>
</html>
