<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manhwa Store Ultimate Edition 🗿🔥</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161926;
      --text-color: #fff;
      --text-muted: #b0c4de;
      --border-color: #333;
      --header-bg: #161926;
      --accent: #8a2be2;
      --accent-glow: #00f2fe;
    }

    [data-theme="light"] {
      --bg-color: #f5f6fa;
      --card-bg: #ffffff;
      --text-color: #2f3640;
      --text-muted: #57606f;
      --border-color: #dcdde1;
      --header-bg: #ffffff;
      --accent: #6c5ce7;
      --accent-glow: #0984e3;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      width: 100%;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }
    
    header {
      background: var(--header-bg);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .header-right-side { display: flex; align-items: center; gap: 8px; }
    .menu-toggler { background: none; border: none; color: var(--text-color); font-size: 22px; cursor: pointer; padding: 0; }
    .logo { color: var(--accent-glow); font-size: 16px; font-weight: bold; cursor: pointer; white-space: nowrap; }

    .header-icons { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      background: none; border: 1.5px solid var(--accent); color: var(--text-color);
      border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center; transition: 0.2s; position: relative; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--accent); color: #fff; }
    
    .badge-count {
      position: absolute; top: -3px; right: -3px; background: #ff4d4d; color: #fff;
      font-size: 9px; width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;
    }

    .side-drawer {
      height: 100%; width: 0; position: fixed; z-index: 9999; top: 0; right: 0;
      background-color: var(--header-bg); overflow-x: hidden; transition: 0.3s;
      padding-top: 60px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); border-left: 2px solid var(--accent);
    }
    .side-drawer a {
      padding: 16px 25px; text-decoration: none; font-size: 18px; color: var(--text-color);
      display: block; transition: 0.2s; border-bottom: 1px solid var(--border-color); background: none; width: 100%; text-align: right; font-weight: bold;
    }
    .side-drawer a:hover { background-color: rgba(138, 43, 226, 0.15); color: var(--accent-glow); }
    .side-drawer .close-btn { position: absolute; top: 12px; left: 20px; font-size: 34px; border: none; background: none; color: var(--text-color); cursor: pointer; }

    .login-nav-btn {
      background: var(--accent); color: #fff; padding: 5px 10px; border-radius: 20px;
      text-decoration: none; font-size: 11px; font-weight: bold; transition: 0.2s; white-space: nowrap;
    }
    .login-nav-btn:hover { background: var(--accent-glow); color: #000; }

    .user-avatar-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--accent);
      cursor: pointer; object-fit: cover; display: none; transition: 0.2s; flex-shrink: 0;
    }
    .user-avatar-btn:hover { border-color: var(--accent-glow); transform: scale(1.05); }

    .profile-modal {
      position: absolute; top: 55px; left: 10px; background: var(--card-bg);
      border: 2px solid var(--accent); border-radius: 12px; padding: 15px;
      width: 270px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.7); z-index: 1000;
    }
    .profile-modal h4 { margin: 0 0 10px 0; color: var(--accent-glow); font-size: 15px; text-align: center; }
    .profile-modal input, .profile-modal textarea {
      width: 100%; background: var(--bg-color); border: 2px solid var(--border-color); color: var(--text-color);
      padding: 9px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; outline: none;
    }
    .profile-modal textarea { height: 45px; resize: none; }
    .stats-box {
      background: rgba(138,43,226,0.15); border: 1px solid var(--accent); padding: 8px;
      border-radius: 8px; font-size: 11px; margin-bottom: 10px; color: var(--text-muted); text-align: center; font-weight: bold;
    }

    .notifications-modal {
      position: absolute; top: 55px; left: 35px; background: var(--card-bg);
      border: 2px solid var(--accent-glow); border-radius: 12px; padding: 15px;
      width: 260px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.7); z-index: 1000; max-height: 250px; overflow-y: auto;
    }
    .notification-item { font-size: 11px; padding: 8px 0; border-bottom: 1px solid var(--border-color); color: #eee; font-weight: bold; }

    .hero-slider {
      width: 100%; max-width: 960px; margin: 15px auto; height: 210px; border-radius: 12px;
      overflow: hidden; position: relative; background: var(--card-bg); border: 2px solid var(--accent); box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .hero-slide { position: absolute; top: 0; right: 0; width: 100%; height: 100%; display: flex; opacity: 0; transition: opacity 0.8s ease-in-out; }
    .hero-slide.active { opacity: 1; }
    .hero-img { width: 45%; height: 100%; object-fit: cover; flex-shrink: 0; }
    .hero-content { width: 55%; padding: 15px; display: flex; flex-direction: column; justify-content: center; background: linear-gradient(to left, var(--card-bg), transparent); }
    .hero-title { font-size: 16px; font-weight: bold; color: var(--accent-glow); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: bold; line-height: 1.4; }

    .continue-reading-bar {
      width: 100%; max-width: 960px; margin: 0 auto 15px auto; background: linear-gradient(135deg, rgba(138,43,226,0.2), rgba(0,242,254,0.2));
      border: 2px solid var(--accent); padding: 10px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
    }

    .genres-container { width: 100%; max-width: 960px; margin: 0 auto 15px auto; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .genres-container::-webkit-scrollbar { display: none; }
    .genre-chip {
      background: var(--card-bg); border: 2px solid var(--border-color); color: var(--text-color);
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.2s; flex-shrink: 0;
    }
    .genre-chip:hover, .genre-chip.active { background: var(--accent); border-color: var(--accent-glow); color: #fff; }

    .top-actions-bar {
      width: 100%; max-width: 960px; margin: 0 auto 15px auto; display: flex; gap: 8px; align-items: center;
    }
    .search-box {
      flex: 1; padding: 10px 14px; background: var(--card-bg); border: 2px solid var(--accent);
      border-radius: 10px; color: var(--text-color); font-size: 13px; font-weight: bold; outline: none;
    }
    .random-btn {
      background: linear-gradient(135deg, #00f2fe, var(--accent)); color: #000; border: none;
      padding: 10px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 12px; white-space: nowrap; flex-shrink: 0;
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 12px; }
    .section-title { color: var(--accent-glow); font-size: 17px; font-weight: bold; margin-bottom: 12px; border-bottom: 3px solid var(--accent); padding-bottom: 4px; display: inline-block; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
    @media(min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; } }

    .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 2px solid var(--border-color); transition: 0.2s; position: relative; cursor: pointer; }
    .card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .card img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .card-body { padding: 9px; }
    .card-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .card-genre-tag { font-size: 10px; font-weight: bold; background: rgba(138,43,226,0.25); color: var(--accent-glow); padding: 2px 5px; border-radius: 4px; display: inline-block; margin-bottom: 5px; }

    .btn { background: var(--accent); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; width: 100%; text-align: center; text-decoration: none; display: block; transition: 0.2s; }
    .btn:hover { background: var(--accent-glow); color: #000; }

    .fav-btn {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75);
      border: none; color: #fff; font-size: 16px; cursor: pointer; border-radius: 50%;
      width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .fav-btn.active { color: #ff4d4d; }

    .delete-card-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(255, 77, 77, 0.95);
      border: none; color: #fff; font-size: 12px; cursor: pointer; border-radius: 50%;
      width: 28px; height: 28px; display: none; align-items: center; justify-content: center; z-index: 5;
    }
    .delete-card-btn:hover { background: #ff0000; }

    #detailsView { display: none; margin-top: 15px; }
    .details-hero { display: flex; gap: 15px; background: var(--card-bg); padding: 15px; border-radius: 12px; border: 2px solid var(--border-color); align-items: flex-start; }
    @media(max-width: 600px) { .details-hero { flex-direction: column; align-items: center; text-align: center; } }
    .details-img { width: 140px; height: 200px; object-fit: cover; border-radius: 8px; border: 2px solid var(--accent); flex-shrink: 0; }
    .details-info { flex: 1; width: 100%; }
    .details-title { font-size: 18px; font-weight: bold; color: var(--accent-glow); margin-bottom: 8px; }
    .details-genre { background: rgba(138,43,226,0.25); color: var(--accent-glow); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
    .details-desc { font-size: 13px; font-weight: bold; color: #ddd; line-height: 1.5; margin-bottom: 12px; }

    .admin-floating-btn {
      position: fixed; bottom: 75px; right: 15px; width: 45px; height: 45px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-glow)); color: #fff; display: none;
      align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); z-index: 999;
    }
    .admin-chat-floating-btn {
      position: fixed; bottom: 75px; left: 15px; width: 45px; height: 45px; border-radius: 50%;
      background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; display: none;
      align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); z-index: 999; text-decoration: none;
    }
    #backToTop {
      position: fixed; bottom: 15px; right: 15px; background-color: var(--accent); color: white;
      border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 18px; cursor: pointer;
      display: none; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); z-index: 998; align-items: center; justify-content: center;
    }

    #toastNotification {
      position: fixed; bottom: -70px; left: 50%; transform: translateX(-50%); background: #161926;
      border: 2px solid var(--accent-glow); color: #fff; padding: 8px 16px; border-radius: 30px;
      font-size: 12px; font-weight: bold; box-shadow: 0 5px 20px rgba(0,0,0,0.6); transition: bottom 0.3s ease-in-out; z-index: 9999; display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    #toastNotification.show { bottom: 20px; }

    .admin-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
    .admin-modal-content { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 2px solid var(--accent); width: 100%; max-width: 380px; }
    .admin-modal-content input, .admin-modal-content select, .admin-modal-content textarea {
      width: 100%; background: var(--bg-color); border: 2px solid var(--border-color); color: var(--text-color);
      padding: 9px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; font-weight: bold; outline: none;
    }
  </style>
</head>
<body data-theme="dark">

  <div id="toastNotification">✨ <span id="toastText">تمت العملية بنجاح</span></div>

  <header>
    <div class="header-right-side">
      <button class="menu-toggler" onclick="toggleNavMenu()">☰</button>
      <div class="logo" onclick="goHome()">Manhwa Store 🗿🔥</div>
    </div>
    
    <div class="header-icons">
      <button class="icon-btn" onclick="toggleNotificationsModal()" title="الإشعارات">
        🔔 <span class="badge-count" id="notifBadge">1</span>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="تغيير المظهر">🌙</button>
      <a href="login.html" id="loginBtnNav" class="login-nav-btn">دخول</a>
      <img id="userAvatarBtn" class="user-avatar-btn" src="" alt="Profile" onclick="toggleProfileModal()">
    </div>

    <div id="notificationsModal" class="notifications-modal">
      <h4 style="color:var(--accent-glow); margin:0 0 8px 0; font-size:13px; border-bottom:2px solid var(--accent); padding-bottom:4px;">التنبيهات الفورية 🔔</h4>
      <div class="notification-item">✨ مرحباً بك في المتجر!</div>
    </div>

    <div id="profileModal" class="profile-modal">
      <h4>الملف الشخصي 👤</h4>
      <div class="stats-box" id="userStatsBox">عدد المفضلات: 0 أعمال</div>
      <input type="text" id="profileNameInput" placeholder="الاسم الشخصي">
      <input type="text" id="profileAvatarInput" placeholder="رابط صورة الآفاتار">
      <textarea id="profileBioInput" placeholder="اكتب وصف قصير (Bio)..."></textarea>
      <button onclick="saveUserProfile()" class="btn">حفظ البيانات</button>
      
      <div style="display:flex; gap:5px; margin-top:8px;">
        <button onclick="logoutUser()" style="background: #ff4d4d; border:none; padding:5px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer; width:100%;">خروج 🚪</button>
      </div>
    </div>
  </header>

  <div id="mySideMenu" class="side-drawer">
    <button class="close-btn" onclick="toggleNavMenu()">&times;</button>
    <a href="#" onclick="toggleNavMenu(); goHome();">🏠 الرئيسية</a>
    <a href="login.html">🔐 تسجيل / دخول</a>
  </div>

  <div id="adminFloatingBtn" class="admin-floating-btn" onclick="openAdminModal()" title="إضافة مانهوا">⚙️</div>
  <a id="adminChatBtn" href="admin-chat.html" class="admin-chat-floating-btn" title="شات الأدمن">💬</a>
  <button id="backToTop" onclick="scrollToTop()" title="العودة للأعلى">⬆</button>

  <div id="adminModalOverlay" class="admin-modal-overlay">
    <div class="admin-modal-content">
      <h3 id="adminModalTitle" style="color: var(--accent-glow); margin-top:0; font-size:16px;">🔒 لوحة الأدمن: إضافة مانهوا</h3>
      <input type="hidden" id="editManhwaId" value="">
      <input type="text" id="newTitle" placeholder="اسم المانهوا">
      <input type="text" id="newCover" placeholder="رابط صورة الغلاف">
      <textarea id="newDesc" placeholder="قصة أو وصف المانهوا..." style="height: 50px;"></textarea>
      
      <label style="font-size:11px; font-weight:bold; color:var(--text-muted);">اختر التصنيف:</label>
      <select id="newGenreSelect">
        <option value="أكشن">أكشن</option>
        <option value="فانتزيا">فانتزيا</option>
        <option value="مغامرات">مغامرات</option>
        <option value="دراما">دراما</option>
      </select>

      <button id="adminSaveBtn" onclick="saveManhwaData()" class="btn" style="margin-top: 10px; margin-bottom: 6px; font-size:13px; padding:9px;">إضافة المانهوا للموقع</button>
      <button onclick="closeAdminModal()" class="btn" style="background: #444; font-size:12px;">إلغاء</button>
    </div>
  </div>

  <div id="homeView">
    <div class="hero-slider" id="heroSlider"></div>

    <div class="container">
      <div class="genres-container" id="genresContainer"></div>

      <div class="top-actions-bar">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث بذكاء عن أي مانهوا..." oninput="filterManhwas()">
        <button class="random-btn" onclick="openRandomManhwa()" title="عمل عشوائي">🎲 عشوائي</button>
      </div>

      <div class="section-title">📚 جميع المانهوات المتاحة</div>
      <div class="grid" id="manhwaGrid"></div>
    </div>
  </div>

  <div id="detailsView" class="container">
    <button onclick="goHome()" class="btn" style="width: auto; margin-bottom: 15px; display: inline-block;">⬅ العودة للرئيسية</button>
    <div class="details-hero">
      <img id="detailImg" class="details-img" src="" alt="Cover">
      <div class="details-info">
        <div id="detailTitle" class="details-title"></div>
        <div id="detailGenre" class="details-genre"></div>
        <div id="detailDesc" class="details-desc"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZmtucnCz49Z0nqX4luO5Ct7yvyHkLQVg",
      authDomain: "manhwastore.firebaseapp.com",
      projectId: "manhwastore",
      storageBucket: "manhwastore.firebasestorage.app",
      messagingSenderId: "706758090521",
      appId: "1:706758090521:web:f2cf72a74a9e36e5296f88",
      measurementId: "G-MS0H0PW03Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const manhwaCollection = collection(db, "manhwas");

    let manhwaData = [];
    const adminUsernames = ["admin", "yhya", "andrew"];

    function checkAdminAuth() {
      const user = (localStorage.getItem("username") || localStorage.getItem("currentUser") || "").toLowerCase().trim();
      return adminUsernames.includes(user);
    }

    function applyAdminUI() {
      const isAdmin = checkAdminAuth();
      document.getElementById("adminFloatingBtn").style.display = isAdmin ? "flex" : "none";
      document.getElementById("adminChatBtn").style.display = isAdmin ? "flex" : "none";
    }

    onSnapshot(manhwaCollection, (snapshot) => {
      manhwaData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderManhwaGrid(manhwaData);
      renderHeroSlider(manhwaData);
      applyAdminUI();
    });

    window.renderManhwaGrid = function(list) {
      const grid = document.getElementById("manhwaGrid");
      grid.innerHTML = "";
      const isAdmin = checkAdminAuth();

      if (list.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted); font-weight: bold;'>لا توجد مانهوات مضافة حتى الآن.</p>";
        return;
      }

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        const deleteBtn = isAdmin ? `<button class="delete-card-btn" style="display:flex;" onclick="event.stopPropagation(); deleteManhwaCloud('${item.id}')" title="حذف">🗑️</button>` : '';
        const editBtn = isAdmin ? `<button class="btn" style="margin-top:5px;" onclick="event.stopPropagation(); editManhwaModal('${item.id}')">تعديل ✏️</button>` : '';

        card.innerHTML = `
          ${deleteBtn}
          <img src="${item.cover || 'https://via.placeholder.com/150'}" alt="${item.title}">
          <div class="card-body">
            <span class="card-genre-tag">${item.genre || 'عام'}</span>
            <div class="card-title">${item.title}</div>
            ${editBtn}
          </div>
        `;
        card.onclick = () => openDetails(item);
        grid.appendChild(card);
      });
    };

    window.renderHeroSlider = function(list) {
      const slider = document.getElementById("heroSlider");
      if (!list || list.length === 0) {
        slider.style.display = "none";
        return;
      }
      slider.style.display = "block";
      const item = list[0];
      slider.innerHTML = `
        <div class="hero-slide active">
          <img class="hero-img" src="${item.cover}" alt="${item.title}">
          <div class="hero-content">
            <div class="hero-title">${item.title}</div>
            <div class="hero-desc">${item.desc || 'لا يوجد وصف متاح.'}</div>
            <button class="btn" onclick="openDetailsById('${item.id}')" style="width:100px;">تصفح الآن 🔥</button>
          </div>
        </div>
      `;
    };

    window.saveManhwaData = async function() {
      if (!checkAdminAuth()) return;
      const id = document.getElementById("editManhwaId").value;
      const title = document.getElementById("newTitle").value.trim();
      const cover = document.getElementById("newCover").value.trim();
      const desc = document.getElementById("newDesc").value.trim();
      const genre = document.getElementById("newGenreSelect").value;

      if (!title || !cover) {
        showToast("⚠️ يرجى إدخال اسم المانهوا ورابط الغلاف!");
        return;
      }

      try {
        if (id) {
          await updateDoc(doc(db, "manhwas", id), { title, cover, desc, genre });
          showToast("✨ تم تحديث بيانات المانهوا أونلاين!");
        } else {
          await addDoc(manhwaCollection, { title, cover, desc, genre, createdAt: new Date() });
          showToast("🚀 تم إضافة المانهوا أونلاين!");
        }
        closeAdminModal();
      } catch (err) {
        showToast("❌ حدث خطأ في الحفظ السحابي");
      }
    };

    window.deleteManhwaCloud = async function(id) {
      if (!checkAdminAuth()) return;
      if (confirm("هل أنت متأكد من رغبتك في حذف هذه المانهوا؟")) {
        try {
          await deleteDoc(doc(db, "manhwas", id));
          showToast("🗑️ تم حذف المانهوا من السحابة!");
        } catch (err) {
          showToast("❌ حدث خطأ أثناء الحذف!");
        }
      }
    };

    window.editManhwaModal = function(id) {
      if (!checkAdminAuth()) return;
      const item = manhwaData.find(m => m.id === id);
      if (!item) return;
      document.getElementById("editManhwaId").value = item.id;
      document.getElementById("newTitle").value = item.title;
      document.getElementById("newCover").value = item.cover;
      document.getElementById("newDesc").value = item.desc || "";
      document.getElementById("newGenreSelect").value = item.genre || "أكشن";
      document.getElementById("adminModalTitle").innerText = "✏️ تعديل بيانات المانهوا";
      document.getElementById("adminModalOverlay").style.display = "flex";
    };

    window.filterManhwas = function() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = manhwaData.filter(m => m.title.toLowerCase().includes(query));
      renderManhwaGrid(filtered);
    };

    window.openDetails = function(item) {
      document.getElementById("homeView").style.display = "none";
      document.getElementById("detailsView").style.display = "block";
      document.getElementById("detailImg").src = item.cover;
      document.getElementById("detailTitle").innerText = item.title;
      document.getElementById("detailGenre").innerText = item.genre || "عام";
      document.getElementById("detailDesc").innerText = item.desc || "لا يوجد وصف حالياً.";
    };

    window.openDetailsById = function(id) {
      const item = manhwaData.find(m => m.id === id);
      if (item) openDetails(item);
    };

    window.goHome = function() {
      document.getElementById("detailsView").style.display = "none";
      document.getElementById("homeView").style.display = "block";
    };

    window.openAdminModal = function() {
      if (!checkAdminAuth()) return;
      document.getElementById("editManhwaId").value = "";
      document.getElementById("newTitle").value = "";
      document.getElementById("newCover").value = "";
      document.getElementById("newDesc").value = "";
      document.getElementById("adminModalTitle").innerText = "🔒 إضافة مانهوا جديدة";
      document.getElementById("adminModalOverlay").style.display = "flex";
    };

    window.closeAdminModal = function() {
      document.getElementById("adminModalOverlay").style.display = "none";
    };

    window.showToast = function(msg) {
      const toast = document.getElementById("toastNotification");
      document.getElementById("toastText").innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    };

    window.toggleNavMenu = function() {
      const nav = document.getElementById("mySideMenu");
      nav.style.width = nav.style.width === "250px" ? "0" : "250px";
    };

    window.toggleTheme = function() {
      const body = document.body;
      const current = body.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      body.setAttribute("data-theme", next);
      document.getElementById("themeBtn").innerText = next === "dark" ? "🌙" : "☀️";
    };

    window.openRandomManhwa = function() {
      if (manhwaData.length === 0) return;
      const randomItem = manhwaData[Math.floor(Math.random() * manhwaData.length)];
      openDetails(randomItem);
    };

    applyAdminUI();
  </script>
</body>
</html>
