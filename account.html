<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الحساب والمكتبة - مانهوانا Manhwana 🗿🔥</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161926;
      --text-color: #fff;
      --text-muted: #8c96a5;
      --border-color: #24283b;
      --header-bg: #161926;
      --accent: #e50914;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0 0 90px 0;
      font-family: sans-serif;
      width: 100%;
      overflow-x: hidden;
    }
    
    header {
      background: var(--header-bg);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .logo-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo-icon { background: #e50914; color: #fff; font-weight: bold; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .logo-text { color: #fff; font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }

    .container { width: 100%; max-width: 960px; margin: 25px auto; padding: 0 15px; }
    .card-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); max-width: 440px; margin: 0 auto; }
    .card-box h2 { margin-top: 0; font-size: 18px; color: #fff; text-align: center; margin-bottom: 5px; }
    .card-box p { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
    
    .input-field { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 11px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; outline: none; transition: 0.2s; direction: ltr; text-align: right; }
    .input-field:focus { border-color: #e50914; }
    
    .btn { background: #e50914; color: #fff; border: none; padding: 11px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; width: 100%; transition: 0.2s; }
    .btn:hover { background: #ff1e29; }
    
    .toggle-text { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 15px; cursor: pointer; }
    .toggle-text span { color: #e50914; font-weight: bold; }

    .profile-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
    .avatar { width: 50px; height: 50px; background: #e50914; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; }
    .profile-info h3 { margin: 0; font-size: 16px; color: #fff; }
    .profile-info span { font-size: 11px; color: var(--text-muted); }

    .menu-list { display: flex; flex-direction: column; gap: 10px; }
    .menu-item {
      background: var(--bg-color); border: 1px solid var(--border-color); padding: 12px 15px;
      border-radius: 10px; color: #fff; font-size: 13px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-decoration: none; transition: 0.2s ease;
    }
    .menu-item:hover { border-color: #e50914; background: rgba(229, 9, 20, 0.08); }
    .menu-content { display: flex; align-items: center; gap: 10px; }
    .menu-icon { width: 18px; height: 18px; fill: var(--text-muted); stroke: var(--text-muted); transition: 0.2s; }
    .menu-item:hover .menu-icon { fill: #e50914; stroke: #e50914; }
    .arrow-icon { font-size: 14px; color: var(--text-muted); }

    .section-title { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-right: 4px solid #e50914; padding-right: 8px; display: flex; justify-content: space-between; align-items: center; }
    .back-to-profile { font-size: 12px; color: #e50914; cursor: pointer; text-decoration: underline; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media(min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; } }

    .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); transition: 0.2s; position: relative; }
    .card img { width: 100%; height: 170px; object-fit: cover; display: block; }
    .card-body { padding: 8px; }
    .card-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .empty-msg { grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 0; }

    .bottom-nav {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 480px; background: rgba(22, 25, 38, 0.95);
      backdrop-filter: blur(12px); border: 1px solid var(--border-color);
      display: flex; justify-content: space-around; padding: 8px 5px; z-index: 1000;
      border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .nav-item {
      background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-decoration: none; transition: 0.2s;
      padding: 6px 14px; border-radius: 12px;
    }
    .nav-item.active, .nav-item:hover { color: #fff; background: rgba(229, 9, 20, 0.2); }
    .nav-item.active svg { fill: #e50914; stroke: #e50914; transform: scale(1.15); }
    .nav-item svg { width: 20px; height: 20px; fill: var(--text-muted); stroke: var(--text-muted); transition: 0.2s; }
  </style>
</head>
<body data-theme="dark">

  <header>
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <div class="logo-container" onclick="location.href='index.html'">
      <div class="logo-icon">M</div>
      <div class="logo-text">مانهوانا</div>
    </div>
  </header>

  <div class="container">
    <div id="authCard" class="card-box" style="display: none;">
      <h2 id="formTitle">تسجيل الدخول</h2>
      <p id="formSubtitle">أدخل اسم المستخدم (بالإنجليزية) وكلمة المرور</p>
      
      <input type="text" id="usernameInput" class="input-field" placeholder="Username (English only)">
      <input type="password" id="passwordInput" class="input-field" placeholder="Password">
      
      <button class="btn" id="submitBtn" onclick="handleAuth()">دخول</button>
      
      <div class="toggle-text" onclick="toggleMode()">
        <span id="toggleMsg">ليس لديك حساب؟ سجل الآن</span>
      </div>
    </div>

    <div id="profileCard" class="card-box" style="display: none;">
      <div class="profile-header">
        <div class="avatar" id="userAvatar">M</div>
        <div class="profile-info">
          <h3 id="profileName">اسم المستخدم</h3>
          <span id="profileRole">عضو نشط</span>
        </div>
      </div>

      <div class="menu-list">
        <div class="menu-item" onclick="openSection('favoritesView', 'renderFavorites')">
          <div class="menu-content">
            <svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>المفضلة والأعمال المحفوظة</span>
          </div>
          <span class="arrow-icon">&larr;</span>
        </div>

        <div class="menu-item" onclick="openSection('historyView', 'renderHistory')">
          <div class="menu-content">
            <svg class="menu-icon" viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
            <span>سجل قراءة المانهوا</span>
          </div>
          <span class="arrow-icon">&larr;</span>
        </div>

        <div class="menu-item" onclick="logout()" style="color: #e50914; border-color: rgba(229, 9, 20, 0.3);">
          <div class="menu-content">
            <svg class="menu-icon" style="fill: #e50914; stroke: #e50914;" viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <span style="color: #e50914;">تسجيل الخروج</span>
          </div>
          <span class="arrow-icon" style="color: #e50914;">&rarr;</span>
        </div>
      </div>
    </div>

    <div id="favoritesView" style="display: none;">
      <div class="section-title">
        <span>المفضلة (المشاهدة لاحقاً)</span>
        <span class="back-to-profile" onclick="closeSections()">← رجوع للحساب</span>
      </div>
      <div class="grid" id="favoritesGrid"></div>
    </div>

    <div id="historyView" style="display: none;">
      <div class="section-title">
        <span>سجل قراءة المانهوا</span>
        <span class="back-to-profile" onclick="closeSections()">← رجوع للحساب</span>
      </div>
      <div class="grid" id="historyGrid"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="search.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>بحث</span>
    </a>
    <a href="genres.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      <span>الأقسام</span>
    </a>
    <a href="account.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>الحساب</span>
    </a>
  </nav>

  <script>
    let isRegistering = false;

    const adminCredentials = {
      "admin": "htibss41",
      "yhya": "htibss41",
      "andrew": "htibss41"
    };

    function checkLoginState() {
      const savedUser = localStorage.getItem("currentUser");
      if (savedUser) {
        document.getElementById("authCard").style.display = "none";
        document.getElementById("profileCard").style.display = "block";
        document.getElementById("profileName").innerText = savedUser;
        document.getElementById("userAvatar").innerText = savedUser.charAt(0).toUpperCase();
        
        if (adminCredentials[savedUser.toLowerCase()]) {
          document.getElementById("profileRole").innerText = "مشرف النظام (Admin) ⚡";
        } else {
          document.getElementById("profileRole").innerText = "عضو مميز";
        }
      } else {
        document.getElementById("authCard").style.display = "block";
        document.getElementById("profileCard").style.display = "none";
        closeSections();
      }
    }

    function toggleMode() {
      isRegistering = !isRegistering;
      const title = document.getElementById("formTitle");
      const subtitle = document.getElementById("formSubtitle");
      const btn = document.getElementById("submitBtn");
      const toggleMsg = document.getElementById("toggleMsg");

      if (isRegistering) {
        title.innerText = "إنشاء حساب جديد";
        subtitle.innerText = "أنشئ حساباً بأسماء إنجليزية لتستمتع بالمفضلة";
        btn.innerText = "تسجيل حساب";
        toggleMsg.innerHTML = "لديك حساب بالفعل؟ <span>تسجيل الدخول</span>";
      } else {
        title.innerText = "تسجيل الدخول";
        subtitle.innerText = "أدخل اسم المستخدم (بالإنجليزية) وكلمة المرور";
        btn.innerText = "دخول";
        toggleMsg.innerHTML = "ليس لديك حساب؟ <span>سجل الآن</span>";
      }
    }

    function handleAuth() {
      let user = document.getElementById("usernameInput").value.trim();
      let pass = document.getElementById("passwordInput").value.trim();

      if (!user || !pass) {
        alert("يرجى ملء جميع الحقول!");
        return;
      }

      const englishRegex = /^[A-Za-z0-9_]+$/;
      if (!englishRegex.test(user)) {
        alert("يجب أن يكون اسم المستخدم باللغة الإنجليزية حصراً!");
        return;
      }

      let usersDB = JSON.parse(localStorage.getItem("manhwana_users") || "{}");

      if (isRegistering) {
        if (usersDB[user] || adminCredentials[user.toLowerCase()]) {
          alert("اسم المستخدم هذا مستخدم مسبقاً!");
          return;
        }
        usersDB[user] = pass;
        localStorage.setItem("manhwana_users", JSON.stringify(usersDB));
        alert("تم إنشاء الحساب بنجاح!");
        localStorage.setItem("currentUser", user);
      } else {
        const lowerUser = user.toLowerCase();
        if (adminCredentials[lowerUser]) {
          if (adminCredentials[lowerUser] === pass) {
            localStorage.setItem("currentUser", user);
          } else {
            alert("كلمة المرور غير صحيحة!");
            return;
          }
        } else {
          if (usersDB[user] && usersDB[user] === pass) {
            localStorage.setItem("currentUser", user);
          } else {
            alert("اسم المستخدم أو كلمة المرور غير صحيحة!");
            return;
          }
        }
      }

      checkLoginState();
    }

    function logout() {
      localStorage.removeItem("currentUser");
      document.getElementById("usernameInput").value = "";
      document.getElementById("passwordInput").value = "";
      isRegistering = false;
      toggleMode();
      checkLoginState();
    }

    function openSection(viewId, renderFunc) {
      document.getElementById("profileCard").style.display = "none";
      document.getElementById("favoritesView").style.display = "none";
      document.getElementById("historyView").style.display = "none";

      document.getElementById(viewId).style.display = "block";
      window[renderFunc]();
    }

    function closeSections() {
      document.getElementById("favoritesView").style.display = "none";
      document.getElementById("historyView").style.display = "none";
      document.getElementById("profileCard").style.display = "block";
    }

    function renderFavorites() {
      const grid = document.getElementById("favoritesGrid");
      grid.innerHTML = "";
      const favorites = JSON.parse(localStorage.getItem("manhwana_favorites") || "[]");

      if (favorites.length === 0) {
        grid.innerHTML = "<div class='empty-msg'>قائمة المفضلة فارغة حالياً. أضف أعمالاً للمشاهدة لاحقاً! 🤍</div>";
        return;
      }

      favorites.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${item.cover}" alt="${item.title}">
          <div class="card-body">
            <div class="card-title">${item.title}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderHistory() {
      const grid = document.getElementById("historyGrid");
      grid.innerHTML = "";
      const history = JSON.parse(localStorage.getItem("manhwana_history") || "[]");

      if (history.length === 0) {
        grid.innerHTML = "<div class='empty-msg'>سجل القراءة فارغ حالياً. ابدأ بقراءة المانهوا لتظهر هنا! 📖</div>";
        return;
      }

      history.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${item.cover}" alt="${item.title}">
          <div class="card-body">
            <div class="card-title">${item.title}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    checkLoginState();
  </script>
</body>
</html>
