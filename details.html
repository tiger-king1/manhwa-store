<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تفاصيل العمل - مانهوانا Manhwana 🗿🔥</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161926;
      --text-color: #fff;
      --text-muted: #8c96a5;
      --border-color: #24283b;
      --header-bg: #161926;
      --accent: #e50914;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0 0 90px 0;
      font-family: sans-serif;
      width: 100%;
      overflow-x: hidden;
    }
    
    header {
      background: var(--header-bg);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .logo-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo-icon { background: #e50914; color: #fff; font-weight: bold; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .logo-text { color: #fff; font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }

    /* واجهة المعلومات العلوية */
    .hero-section {
      position: relative;
      width: 100%;
      height: 420px;
      overflow: hidden;
    }
    .hero-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5);
    }
    .hero-gradient {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to top, var(--bg-color) 10%, rgba(13,15,23,0.7) 60%, transparent 100%);
    }
    .hero-details {
      position: absolute;
      bottom: 15px;
      left: 0; right: 0;
      padding: 0 15px;
      text-align: center;
    }
    .work-title {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .work-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 15px;
    }
    .imdb-badge { background: #f5c518; color: #000; padding: 1px 5px; border-radius: 4px; font-weight: bold; font-size: 10px; }

    /* أزرار التفاعل */
    .action-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 0 15px;
    }
    .action-icon-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      transition: 0.2s;
    }
    .action-icon-btn svg { width: 22px; height: 22px; fill: #fff; transition: 0.2s; }
    .action-icon-btn.active svg { fill: #e50914; }
    .action-icon-btn:hover { color: #fff; }

    .watch-btn {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 12px 35px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
      transition: 0.2s;
    }
    .watch-btn:hover { background: #ff1e29; }
    .watch-btn svg { width: 16px; height: 16px; fill: #fff; }

    .container { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 15px; }
    .story-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .section-title { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 12px; border-right: 4px solid #e50914; padding-right: 8px; }
    
    .chapters-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 30px;
    }
    .chapter-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .chapter-item:hover { border-color: #e50914; background: rgba(229, 9, 20, 0.1); }
    .chapter-num { color: var(--text-muted); font-size: 11px; }

    /* إشعار عائم فخم (Toast Notification) */
    #toastNotification {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(22, 25, 38, 0.95);
      border: 1px solid #e50914;
      color: #fff;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toastNotification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .bottom-nav {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 480px; background: rgba(22, 25, 38, 0.95);
      backdrop-filter: blur(12px); border: 1px solid var(--border-color);
      display: flex; justify-content: space-around; padding: 8px 5px; z-index: 1000;
      border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .nav-item {
      background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-decoration: none; transition: 0.2s;
      padding: 6px 14px; border-radius: 12px;
    }
    .nav-item.active, .nav-item:hover { color: #fff; background: rgba(229, 9, 20, 0.2); }
    .nav-item.active svg { fill: #e50914; stroke: #e50914; transform: scale(1.15); }
    .nav-item svg { width: 20px; height: 20px; fill: var(--text-muted); stroke: var(--text-muted); transition: 0.2s; }
  </style>
</head>
<body data-theme="dark">

  <header>
    <button class="back-btn" onclick="history.back()">←</button>
    <div class="logo-container" onclick="location.href='index.html'">
      <div class="logo-icon">M</div>
      <div class="logo-text">مانهوانا</div>
    </div>
  </header>

  <!-- إشعار عائم -->
  <div id="toastNotification">تمت الإضافة بنجاح</div>

  <div id="detailsView">
    <div class="hero-section">
      <img id="workCover" class="hero-bg" src="" alt="">
      <div class="hero-gradient"></div>
      <div class="hero-details">
        <div id="workTitle" class="work-title">اسم العمل</div>
        <div class="work-meta">
          <span>2026</span>
          <span>•</span>
          <span id="workGenre">أكشن</span>
          <span>•</span>
          <span class="imdb-badge">8.6</span>
        </div>
      </div>
    </div>

    <!-- أزرار التفاعل -->
    <div class="action-buttons" style="margin-top: -20px; position: relative; z-index: 10;">
      <button id="favBtn" class="action-icon-btn" onclick="toggleFavorite()">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span id="favText">المشاهدة لاحقا</span>
      </button>

      <button class="watch-btn" onclick="startReading()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span>قراءة الآن</span>
      </button>

      <button id="downloadBtn" class="action-icon-btn" onclick="startDownload()">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span id="downloadText">تحميل</span>
      </button>
    </div>

    <div class="container">
      <div class="story-box" id="workDesc">قصة العمل المشوقة والمميزة تظهر هنا...</div>

      <div class="section-title">فصول المانهوا</div>
      <div class="chapters-list" id="chaptersList"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="search.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>بحث</span>
    </a>
    <a href="genres.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      <span>الأقسام</span>
    </a>
    <a href="account.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>الحساب</span>
    </a>
  </nav>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const title = urlParams.get('title') || 'اسم العمل';
    const cover = urlParams.get('cover') || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500';
    const desc = urlParams.get('desc') || 'قصة مشوقة ومميزة لهذا العمل الرائع.';
    const genre = urlParams.get('genre') || 'أكشن';

    document.getElementById("workTitle").innerText = title;
    document.getElementById("workCover").src = cover;
    document.getElementById("workDesc").innerText = desc;
    document.getElementById("workGenre").innerText = genre;

    // دالة عرض الإشعارات المعلقة (Toast)
    function showToast(msg) {
      const toast = document.getElementById("toastNotification");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    // إضافة العمل تلقائياً إلى "سجل القراءة" عند فتح الصفحة أو البدء بالقراءة
    function addToHistory() {
      let history = JSON.parse(localStorage.getItem("manhwana_history") || "[]");
      // إزالة العمل إذا كان موجوداً مسبقاً ليتم وضعه في المقدمة
      history = history.filter(item => item.title !== title);
      history.unshift({ title, cover, desc, genre });
      localStorage.setItem("manhwana_history", JSON.stringify(history));
    }

    // تنفيذ السجل فور فتح الصفحة
    addToHistory();

    // فحص حالة المفضلة لتلوين الأيقونة
    function checkFavoriteState() {
      let favs = JSON.parse(localStorage.getItem("manhwana_favorites") || "[]");
      const exists = favs.find(f => f.title === title);
      const btn = document.getElementById("favBtn");
      if (exists) {
        btn.classList.add("active");
        document.getElementById("favText").innerText = "محفوظ";
      } else {
        btn.classList.remove("active");
        document.getElementById("favText").innerText = "المشاهدة لاحقا";
      }
    }
    checkFavoriteState();

    // تبديل حالة المفضلة
    function toggleFavorite() {
      let favs = JSON.parse(localStorage.getItem("manhwana_favorites") || "[]");
      const index = favs.findIndex(f => f.title === title);
      if (index === -1) {
        favs.push({ title, cover, desc, genre });
        localStorage.setItem("manhwana_favorites", JSON.stringify(favs));
        showToast("✓ تمت الإضافة إلى المفضلة");
      } else {
        favs.splice(index, 1);
        localStorage.setItem("manhwana_favorites", JSON.stringify(favs));
        showToast("✓ تمت الإزالة من المفضلة");
      }
      checkFavoriteState();
    }

    // بدء القراءة (تحديث السجل والانتقال للفصل الأول)
    function startReading() {
      addToHistory();
      showToast("📖 تم التحديث في سجل القراءة");
      setTimeout(() => {
        location.href = `read.html?title=${encodeURIComponent(title)}&chapter=1`;
      }, 600);
    }

    // محاكي التحميل الواقعي مع إظهار النسبة المئوية
    let isDownloading = false;
    function startDownload() {
      if (isDownloading) return;
      isDownloading = true;
      const downloadText = document.getElementById("downloadText");
      
      let progress = 0;
      showToast("⬇️ بدأ تحميل العمل...");
      
      const interval = setInterval(() => {
        progress += 20;
        downloadText.innerText = `${progress}%`;
        if (progress >= 100) {
          clearInterval(interval);
          downloadText.innerText = "تم التحميل";
          isDownloading = false;
          showToast("✓ تم إتمام التحميل بنجاح!");
          setTimeout(() => {
            downloadText.innerText = "تحميل";
          }, 4000);
        }
      }, 400);
    }

    // توليد قائمة الفصول وتوجيهها لصفحة القراءة
    const chaptersContainer = document.getElementById("chaptersList");
    for (let i = 10; i >= 1; i--) {
      const ch = document.createElement("a");
      ch.className = "chapter-item";
      ch.href = `read.html?title=${encodeURIComponent(title)}&chapter=${i}`;
      ch.onclick = () => addToHistory();
      ch.innerHTML = `
        <span>الفصل ${i}</span>
        <span class="chapter-num">الموسم 1</span>
      `;
      chaptersContainer.appendChild(ch);
    }
  </script>
</body>
</html>
